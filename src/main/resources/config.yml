# SkyXCore 0.1.0
# Competitive core: stats, leaderboards, guilds and seasons.
# The repository config is a template. Put real credentials only in the
# server-side config, never commit them to GitHub.

database:
  host: "127.0.0.1"
  port: 3306
  name: "s29_skyxcore"
  user: "CHANGE_ME"
  password: "CHANGE_ME"
  table-prefix: "skyxcore"
  connection-timeout-ms: 5000
  socket-timeout-ms: 8000

network:
  # Identifies this backend in logs; the shared database is still used by both.
  server-id: "survival"

sources:
  # Money/Playtime/Jobs are read-only external sources. Their credentials are
  # intentionally separate from the SkyXCore database.
  money:
    enabled: true
    host: "127.0.0.1"
    port: 3306
    database: "s29_eco"
    user: "CHANGE_ME"
    password: "CHANGE_ME"
    table: "MoneyTable"
  playtime:
    enabled: true
    host: "127.0.0.1"
    port: 3306
    database: "s29_playtime"
    user: "CHANGE_ME"
    password: "CHANGE_ME"
    table: "skyx_playtime_players"
  jobs:
    enabled: true
    host: "127.0.0.1"
    port: 3306
    database: "s29_jobs"
    user: "CHANGE_ME"
    password: "CHANGE_ME"
    users-table: "jobs_users"
    points-table: "jobs_points"

stats:
  enabled: true
  # Stats are accumulated in memory and written in async batches.
  flush-interval-seconds: 15
  ignore-creative: true
  ignored-worlds:
    - "world_parkour"
  anti-farm:
    # A player cannot farm the same victim repeatedly within this window.
    pvp-min-kill-interval-seconds: 300
    # Do not count kills where both players share the same IP.
    pvp-block-same-ip: true
    # Do not count mobs spawned by spawners.
    ignore-spawner-mobs: true
  crops:
    - WHEAT
    - CARROTS
    - POTATOES
    - BEETROOTS
    - NETHER_WART
    - PUMPKIN
    - MELON
    - SUGAR_CANE
    - CACTUS
    - BAMBOO
    - KELP
    - COCOA
  bosses:
    - ENDER_DRAGON
    - WITHER
    - WARDEN

leaderboards:
  enabled: true
  page-size: 10
  command-cooldown-seconds: 2
  gui-click-delay-ms: 300
  cache-seconds: 0
  categories:
    money:
      display: "&6Money"
      icon: GOLD_INGOT
      source: MONEY
      format: MONEY
    playtime:
      display: "&9Playtime"
      icon: CLOCK
      source: PLAYTIME
      format: TIME
    guilds:
      display: "&dTop Guilds"
      icon: SHIELD
      source: GUILDS
      format: NUMBER
    pvp_kills:
      display: "&cPvP Kills"
      icon: IRON_SWORD
      source: STATS
      stat: PVP_KILLS
      format: NUMBER
    crops_broken:
      display: "&aCrops Broken"
      icon: WHEAT
      source: STATS
      stat: CROPS_BROKEN
      format: NUMBER
    mob_kills:
      display: "&2Mob Kills"
      icon: ROTTEN_FLESH
      source: STATS
      stat: MOB_KILLS
      format: NUMBER
    blocks_broken:
      display: "&7Blocks Broken"
      icon: STONE
      source: STATS
      stat: BLOCKS_BROKEN
      format: NUMBER
    boss_damage:
      display: "&5Boss Damage"
      icon: DRAGON_HEAD
      source: STATS
      stat: BOSS_DAMAGE
      format: NUMBER
    job_points:
      display: "&eJob Points"
      icon: EXPERIENCE_BOTTLE
      source: JOBS
      format: NUMBER

guilds:
  enabled: true
  create-cost: 10000
  tag-min-length: 3
  tag-max-length: 8
  name-min-length: 3
  name-max-length: 24
  default-max-members: 16
  invite-expire-seconds: 120
  chat-format: "&8[&d%tag%&8] &f%player%&7: &f%message%"
  home:
    enabled: true
    warmup-seconds: 5
    cooldown-seconds: 120
  bank:
    enabled: true
  power:
    # Power = members * member-weight
    #       + sum(PvP kills * pvp-weight)
    #       + sum(boss damage * boss-weight)
    #       + sum(mob kills * mob-weight)
    #       + sum(crops * crop-weight)
    #       + sum(blocks * block-weight)
    #       + sum(playtime hours * playtime-weight)
    #       + bank * bank-weight
    member-weight: 100
    pvp-weight: 10
    boss-weight: 0.01
    mob-weight: 0.2
    crop-weight: 0.05
    block-weight: 0.01
    playtime-weight: 2
    bank-weight: 0.001

holograms:
  # Two independent TextDisplays: Java viewers use the Java height and
  # Bedrock/Geyser viewers use the Bedrock height. Both are positioned at an
  # absolute offset above the player's eyes (never as passengers, so looking
  # up/down cannot move them). 0.70 gives a small gap above the nametag.
  enabled: true
  height: 0.70
  bedrock-height: 0.70
  update-interval-ticks: 20
  move-interval-ticks: 5
  format: "&6%lighteconomy_money%₪ &8| &c%skyxcore_pvp_kills% PvP"
  ignored-worlds: []

season:
  enabled: true
  current-id: "S6"
  length-days: 180
  auto-start: true
  # Season rewards are configurable console commands per category/rank.
  # Player categories use %player%; guild categories use %player% as the
  # guild leader's name. Empty lists disable that reward row.
  rewards:
    money:
      1: ["eco give %player% 25000"]
      2: ["eco give %player% 15000"]
      3: ["eco give %player% 10000"]
      4: ["eco give %player% 7500"]
      5: ["eco give %player% 5000"]
    playtime:
      1: ["eco give %player% 25000"]
      2: ["eco give %player% 15000"]
      3: ["eco give %player% 10000"]
      4: ["eco give %player% 7500"]
      5: ["eco give %player% 5000"]
    guilds:
      1: ["eco give %player% 25000"]
      2: ["eco give %player% 15000"]
      3: ["eco give %player% 10000"]
      4: ["eco give %player% 7500"]
      5: ["eco give %player% 5000"]
    pvp_kills:
      1: ["eco give %player% 25000"]
      2: ["eco give %player% 15000"]
      3: ["eco give %player% 10000"]
      4: ["eco give %player% 7500"]
      5: ["eco give %player% 5000"]
    crops_broken:
      1: ["eco give %player% 25000"]
      2: ["eco give %player% 15000"]
      3: ["eco give %player% 10000"]
      4: ["eco give %player% 7500"]
      5: ["eco give %player% 5000"]
    mob_kills:
      1: ["eco give %player% 25000"]
      2: ["eco give %player% 15000"]
      3: ["eco give %player% 10000"]
      4: ["eco give %player% 7500"]
      5: ["eco give %player% 5000"]
    blocks_broken:
      1: ["eco give %player% 25000"]
      2: ["eco give %player% 15000"]
      3: ["eco give %player% 10000"]
      4: ["eco give %player% 7500"]
      5: ["eco give %player% 5000"]
    boss_damage:
      1: ["eco give %player% 25000"]
      2: ["eco give %player% 15000"]
      3: ["eco give %player% 10000"]
      4: ["eco give %player% 7500"]
      5: ["eco give %player% 5000"]
    job_points:
      1: ["eco give %player% 25000"]
      2: ["eco give %player% 15000"]
      3: ["eco give %player% 10000"]
      4: ["eco give %player% 7500"]
      5: ["eco give %player% 5000"]

